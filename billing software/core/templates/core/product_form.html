{% extends "core/base.html" %}
{% block content %}
<style>
    .container { 
        max-width: 700px; 
        margin: 2rem auto; 
        padding: 2rem; 
        background: #fff; 
        border-radius: 12px; 
        box-shadow: 0 6px 16px rgba(0,0,0,0.08); 
    }

    /* Page Title */
    h1, h2 { 
        font-size: 2rem; 
        font-weight: 700; 
        text-align: center; 
        margin-bottom: 2rem; 
        color: #1e293b; 
        position: relative;
    }
    h1::after, h2::after {
        content: "";
        display: block;
        width: 60px;
        height: 4px;
        background: linear-gradient(90deg, #3b82f6, #6366f1);
        margin: 0.5rem auto 0;
        border-radius: 2px;
    }

    /* Form Styling */
    form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    label {
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.25rem;
    }

    input, textarea {
        width: 100%;
        padding: 10px 12px;
        font-size: 15px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #f9fafb;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        outline: none;
        background: #fff;
    }

    textarea {
        resize: vertical;
        min-height: 80px;
    }

    /* Buttons */
    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        margin-top: 1.5rem;
    }

    .btn {
        display: inline-block;
        padding: 10px 18px;
        font-weight: 500;
        text-decoration: none;
        border-radius: 8px;
        transition: all 0.2s ease-in-out;
        border: none;
    }

    .btn-primary {
        background-color: #3b82f6;
        color: white;
    }
    .btn-primary:hover {
        background-color: #2563eb;
    }

    .btn-secondary {
        background-color: #6b7280;
        color: white;
    }
    .btn-secondary:hover {
        background-color: #4b5563;
    }

    @media (max-width: 600px) {
        .container {
            padding: 1.5rem;
        }
        input, textarea {
            font-size: 14px;
        }
        .btn {
            font-size: 14px;
            padding: 8px 14px;
        }
    }
</style>

<div class="container">
    <h2>{{ title }}</h2>
    <form method="POST">
        {% csrf_token %}
        
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="description">Description</label>
        <textarea id="description" name="description"></textarea>

        <label for="category">Category</label>
        <input type="text" id="category" name="category">

        <label for="unit">Unit</label>
        <input type="text" id="unit" name="unit" value="pcs">

        <label for="cost_price">Cost Price</label>
        <input type="number" step="0.01" id="cost_price" name="cost_price">

        <label for="selling_price">Selling Price</label>
        <input type="number" step="0.01" id="selling_price" name="selling_price">

        <label for="min_quantity">Minimum Quantity</label>
        <input type="number" id="min_quantity" name="min_quantity">

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
