{% extends 'core/base.html' %}

{% block title %}Edit Customer{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[90vh] px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-2xl">
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Edit Customer</h2>

    <form method="post" class="space-y-5">
      {% csrf_token %}

      <!-- Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Name</label>
        <input type="text" name="name" value="{{ customer.name }}" 
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
        <span class="text-red-600 text-sm" id="error-name"></span>
      </div>

      <!-- Phone -->
      <div>
        <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">Phone</label>
        <input type="tel" name="phone" value="{{ customer.phone }}" 
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" required inputmode="numeric" maxlength="10">
               <span class="text-red-600 text-sm" id="error-phone"></span>
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" name="email" value="{{ customer.email }}" 
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
               <span class="text-red-600 text-sm" id="error-email"></span>
      </div>

      <!-- DOB -->
      <div>
        <label for="dob" class="block text-sm font-medium text-slate-700 mb-1">Date of Birth</label>
        <input type="date" name="dob" value="{{ customer.dob|date:'Y-m-d' }}" 
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" >
      </div>

      <!-- Gender -->
      <div>
        <label for="gender" class="block text-sm font-medium text-slate-700 mb-1">Gender</label>
        <select name="gender" 
                class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
          <option value="">Select Gender</option>
          <option value="M" {% if customer.gender == 'M' %}selected{% endif %}>Male</option>
          <option value="F" {% if customer.gender == 'F' %}selected{% endif %}>Female</option>
          <option value="O" {% if customer.gender == 'O' %}selected{% endif %}>Other</option>
        </select>
      </div>

      <!-- State -->
      <div>
        <label for="state" class="block text-sm font-medium text-slate-700 mb-1">State</label>
        <select name="state" 
                class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="">Select State</option>
          <option value="Andhra Pradesh" {% if customer.state == 'Andhra Pradesh' %}selected{% endif %}>Andhra Pradesh</option>
          <option value="Arunachal Pradesh" {% if customer.state == 'Arunachal Pradesh' %}selected{% endif %}>Arunachal Pradesh</option>
          <option value="Assam" {% if customer.state == 'Assam' %}selected{% endif %}>Assam</option>
          <option value="Bihar" {% if customer.state == 'Bihar' %}selected{% endif %}>Bihar</option>
          <option value="Chhattisgarh" {% if customer.state == 'Chhattisgarh' %}selected{% endif %}>Chhattisgarh</option>
          <option value="Goa" {% if customer.state == 'Goa' %}selected{% endif %}>Goa</option>
          <option value="Gujarat" {% if customer.state == 'Gujarat' %}selected{% endif %}>Gujarat</option>
          <option value="Haryana" {% if customer.state == 'Haryana' %}selected{% endif %}>Haryana</option>
          <option value="Himachal Pradesh" {% if customer.state == 'Himachal Pradesh' %}selected{% endif %}>Himachal Pradesh</option>
          <option value="Jharkhand" {% if customer.state == 'Jharkhand' %}selected{% endif %}>Jharkhand</option>
          <option value="Karnataka" {% if customer.state == 'Karnataka' %}selected{% endif %}>Karnataka</option>
          <option value="Kerala" {% if customer.state == 'Kerala' %}selected{% endif %}>Kerala</option>
          <option value="Madhya Pradesh" {% if customer.state == 'Madhya Pradesh' %}selected{% endif %}>Madhya Pradesh</option>
          <option value="Maharashtra" {% if customer.state == 'Maharashtra' %}selected{% endif %}>Maharashtra</option>
          <option value="Manipur" {% if customer.state == 'Manipur' %}selected{% endif %}>Manipur</option>
          <option value="Meghalaya" {% if customer.state == 'Meghalaya' %}selected{% endif %}>Meghalaya</option>
          <option value="Mizoram" {% if customer.state == 'Mizoram' %}selected{% endif %}>Mizoram</option>
          <option value="Nagaland" {% if customer.state == 'Nagaland' %}selected{% endif %}>Nagaland</option>
          <option value="Odisha" {% if customer.state == 'Odisha' %}selected{% endif %}>Odisha</option>
          <option value="Punjab" {% if customer.state == 'Punjab' %}selected{% endif %}>Punjab</option>
          <option value="Rajasthan" {% if customer.state == 'Rajasthan' %}selected{% endif %}>Rajasthan</option>
          <option value="Sikkim" {% if customer.state == 'Sikkim' %}selected{% endif %}>Sikkim</option>
          <option value="Tamil Nadu" {% if customer.state == 'Tamil Nadu' %}selected{% endif %}>Tamil Nadu</option>
          <option value="Telangana" {% if customer.state == 'Telangana' %}selected{% endif %}>Telangana</option>
          <option value="Tripura" {% if customer.state == 'Tripura' %}selected{% endif %}>Tripura</option>
          <option value="Uttar Pradesh" {% if customer.state == 'Uttar Pradesh' %}selected{% endif %}>Uttar Pradesh</option>
          <option value="Uttarakhand" {% if customer.state == 'Uttarakhand' %}selected{% endif %}>Uttarakhand</option>
          <option value="West Bengal" {% if customer.state == 'West Bengal' %}selected{% endif %}>West Bengal</option>
        </select>
      </div>

      <!-- District -->
      <div>
        <label for="district" class="block text-sm font-medium text-slate-700 mb-1">District</label>
        <input type="text" name="district" value="{{ customer.district }}" 
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <!-- Place -->
      <div>
        <label for="place" class="block text-sm font-medium text-slate-700 mb-1">Place</label>
        <input type="text" name="place" value="{{ customer.place }}" 
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <!-- Pincode -->
      <div>
        <label for="pincode" class="block text-sm font-medium text-slate-700 mb-1">Pincode</label>
        <input type="text" name="pincode" value="{{ customer.pincode }}" 
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
               <span class="text-red-600 text-sm" id="error-pincode"></span>
      </div>

      <!-- Address -->
      <div>
        <label for="address" class="block text-sm font-medium text-slate-700 mb-1">Address</label>
        <textarea name="address" rows="4" 
                  class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">{{ customer.address }}</textarea>
      </div>

      <!-- Submit -->
      <button type="submit" 
              class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition-colors">
        Update
      </button>
    </form>

    <div class="mt-4 text-center">
      <a href="{% url 'customer_list_create' %}" 
         class="inline-block bg-slate-200 text-slate-700 px-4 py-2 rounded-lg hover:bg-slate-300 transition-colors">
        ← Back to Customer List
      </a>
    </div>
  </div>
  
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
  const form = document.querySelector('form');
  if (!form) return;

  // fields to validate
  const rules = [
    {
      name: 'name',
      validate: v => v.trim().length >= 3,
      message: 'Name must be at least 3 characters.'
    },
    {
      name: 'phone',
      // accept digits anywhere (will strip spaces/hyphens) and require exactly 10 digits
      validate: v => {
        const digits = (v || '').toString().replace(/\D/g, '');
        return /^\d{10}$/.test(digits);
      },
      message: 'Phone must contain exactly 10 digits.'
    },
    {
      name: 'email',
      validate: v => {
        if (!v) return true; // optional field
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
      },
      message: 'Enter a valid email address.'
    },
    {
      name: 'pincode',
      validate: v => {
        if (!v) return true; // optional field
        const digits = (v || '').toString().replace(/\D/g, '');
        return /^\d{6}$/.test(digits);
      },
      message: 'Pincode must be 6 digits.'
    }
  ];

  function getInput(name) {
    return form.querySelector(`[name="${name}"]`);
  }

  function ensureErrorSpan(input) {
    const id = 'error-' + (input.getAttribute('name') || Math.random().toString(36).slice(2));
    let span = form.querySelector('#' + id);
    if (!span) {
      span = document.createElement('span');
      span.id = id;
      span.className = 'error';
      input.insertAdjacentElement('afterend', span);
    }
    return span;
  }

  // wire up input listeners to clear errors as user types
  rules.forEach(rule => {
    const input = getInput(rule.name);
    if (!input) return;
    ensureErrorSpan(input);
    input.addEventListener('input', () => {
      const span = form.querySelector('#error-' + rule.name) || input.nextElementSibling;
      if (span) span.textContent = '';
      input.classList.remove('invalid');
      input.removeAttribute('aria-invalid');
    });
  });

  form.addEventListener('submit', function (e) {
    let firstInvalid = null;

    rules.forEach(rule => {
      const input = getInput(rule.name);
      if (!input) return;
      // read value safely (handles type=number too)
      let val = input.value;
      if (val === undefined || val === null) val = '';

      const ok = rule.validate(val);
      const span = ensureErrorSpan(input);

      if (!ok) {
        span.textContent = rule.message;
        input.classList.add('invalid');
        input.setAttribute('aria-invalid', 'true');
        if (!firstInvalid) firstInvalid = input;
      } else {
        span.textContent = '';
        input.classList.remove('invalid');
        input.removeAttribute('aria-invalid');
      }
    });

    if (firstInvalid) {
      e.preventDefault();
      firstInvalid.focus();
      firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
});

</script>

{% endblock %}
