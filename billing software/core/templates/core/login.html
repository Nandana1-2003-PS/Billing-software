<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-6">Login</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div>
        <!-- <h1>ne</h1> -->
        <label class="block text-sm font-medium">Username</label>
        <input type="text" name="username" required class="w-full px-3 py-2 border rounded-lg">
      </div>
      <div>
        <label class="block text-sm font-medium">Password</label>
        <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg">
      </div>
      <button class="w-full bg-indigo-600 text-white py-2 rounded-lg">Login</button>
    </form>
    {% if messages %}
      {% for message in messages %}
        <p class="text-red-500 mt-2">{{ message }}</p>
      {% endfor %}
    {% endif %}
  </div>
</body>
</html>
